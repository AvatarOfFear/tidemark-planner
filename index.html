<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--APP-HEAD-->
<title>Tidemark Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail (nav + summary) beside one working surface; on phones the rail becomes a bottom tab bar. */
:root {
  --bg: #f4f7f7;
  --surface: #ffffff;
  --surface-2: #eaf0f0;
  --line: #d5dfdf;
  --fg: #132426;
  --muted: #5a6c6e;
  --accent: #0e6b66;
  --accent-ink: #ffffff;
  --accent-soft: #d6ecea;
  --danger: #b3361f;
  --warn: #9a6200;
  --ok: #2c7a4b;
  --shadow: 0 1px 2px rgba(15, 40, 42, .06), 0 8px 24px rgba(15, 40, 42, .08);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r: 10px;
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1617; --surface: #152022; --surface-2: #1c2a2c; --line: #2a3b3d;
    --fg: #e2ecec; --muted: #93a6a7; --accent: #4cc2b6; --accent-ink: #062422; --accent-soft: #173836;
    --danger: #ef7d64; --warn: #e2a74c; --ok: #6cc590;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1617; --surface: #152022; --surface-2: #1c2a2c; --line: #2a3b3d;
  --fg: #e2ecec; --muted: #93a6a7; --accent: #4cc2b6; --accent-ink: #062422; --accent-soft: #173836;
  --danger: #ef7d64; --warn: #e2a74c; --ok: #6cc590;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; padding-inline: 6px; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-weight: 500;
}
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.summary { display: grid; gap: 8px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.stat b { font-family: var(--f-mono); font-size: 18px; font-weight: 500; }
.stat.alert b { color: var(--danger); }
.side .spacer { flex: 1; }

main { min-width: 0; padding: 26px 28px 40px; }
.mtop { display: none; }
.tabbar, .fab { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; }
.btn.block { width: 100%; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { width: 36px; height: 36px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* ---------- view header ---------- */
.vh { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin-bottom: 18px; }
.vh h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.05; }
.vh .sub { margin: 6px 0 0; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 14px; margin-bottom: 18px; border-radius: var(--r);
  background: var(--accent-soft); color: var(--fg); font-size: 14px;
}
.banner span { flex: 1 1 220px; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.month {
  display: grid; grid-template-columns: 2.4rem repeat(7, minmax(0, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
}
.dow, .wk-h { padding: 8px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.wk-h, .wk { text-align: center; }
.wk { font: 11px var(--f-mono); color: var(--muted); padding-top: 9px; border-top: 1px solid var(--line); background: var(--surface-2); }
.day {
  position: relative; min-height: 104px; padding: 6px; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0;
}
.day:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.day.wkend { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.day.out .num { color: var(--muted); opacity: .55; }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.num { font: 500 13px var(--f-mono); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.day.today .num { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip {
  --c: var(--muted);
  display: block; width: 100%; text-align: left; border: 0; border-radius: 4px;
  padding: 2px 6px; font-size: 12px; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--fg);
  border-left: 3px solid var(--c);
}
.chip b { font: 500 11px var(--f-mono); }
.chip.tk { background: none; border-left: 0; padding-left: 2px; }
.chip.tk .box { display: inline-block; width: 9px; height: 9px; border: 1.5px solid var(--c); border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chip.tk.done { color: var(--muted); text-decoration: line-through; }
.chip.tk.done .box { background: var(--c); }
.chip.dl { background: none; border: 1px dashed var(--c); font-weight: 600; }
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; padding-left: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.panel h2 { font-size: 20px; }
.panel .add { display: flex; gap: 8px; margin-top: 14px; }
.items { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 6px; border-radius: 8px; }
.item:hover { background: var(--surface-2); }
.item .when { font: 12px var(--f-mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.item .what { min-width: 0; }
.item .t { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.pdot { display: inline-flex; align-items: center; gap: 5px; }
.pdot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.check {
  width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--c, var(--muted)); background: none; padding: 0;
  display: inline-grid; place-items: center; margin-top: 1px;
}
.check.on { background: var(--c, var(--muted)); }
.check.on::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.item.task .when { display: flex; justify-content: flex-end; }
.item.done .t { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); padding: 14px 6px; font-size: 14px; }

.agenda { display: grid; gap: 18px; max-width: 760px; }
.agenda section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.agenda h3 { font-size: 16px; display: flex; gap: 10px; align-items: baseline; }
.agenda h3 .mono { font-size: 12px; color: var(--muted); font-weight: 400; }
.agenda section.overdue h3 { color: var(--danger); }
.agenda .items { margin-top: 6px; }

/* ---------- projects ---------- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 22px; }
.pcard {
  --c: var(--muted);
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
  border-top: 4px solid var(--c); min-width: 0;
}
.pcard:hover { box-shadow: var(--shadow); }
.pcard[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: -1px; }
.pcard h3 { font-size: 17px; overflow-wrap: anywhere; }
.pcard .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.late { color: var(--danger) !important; font-weight: 600; }
.soon { color: var(--warn) !important; font-weight: 600; }

.pdetail { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: -6px 0 18px; color: var(--muted); font-size: 14px; }
.pdetail p { margin: 0; flex: 1 1 260px; max-width: 65ch; color: var(--fg); }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; min-height: 160px; border: 2px dashed transparent; transition: border-color .15s; }
.col.over { border-color: var(--accent); }
.col header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; }
.col header h3 { font-size: 15px; }
.col header .mono { font-size: 12px; color: var(--muted); }
.cards { display: grid; gap: 8px; }
.card {
  --c: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  display: grid; gap: 6px; cursor: grab; border-left: 3px solid var(--c);
}
.card.dragging { opacity: .45; }
.card .t { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow-wrap: anywhere; }
.card.done .t { color: var(--muted); text-decoration: line-through; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.card .move { margin-left: auto; border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 0; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.high { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
.pill.med { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.col .addt { width: 100%; margin-top: 8px; border: 0; background: none; color: var(--muted); padding: 8px; border-radius: 8px; text-align: left; font-weight: 500; }
.col .addt:hover { background: var(--surface); color: var(--fg); }

/* ---------- gantt ---------- */
.gt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.gt { --lab: 230px; position: relative; }
.gt-row { display: grid; grid-template-columns: var(--lab) var(--w); height: 40px; border-top: 1px solid var(--line); }
.gt-row.head { height: 44px; border-top: 0; }
.gt-row.proj, .gt-row.group { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.gt-lab {
  position: sticky; left: 0; z-index: 3; background: inherit; background-color: var(--surface);
  padding: 0 10px; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px;
}
.gt-row.proj .gt-lab, .gt-row.group .gt-lab { background-color: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.gt-lab .t { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-row.proj .t { font-weight: 700; }
.gt-row.task .gt-lab { padding-left: 34px; }
.gt-row.task.done .t { color: var(--muted); text-decoration: line-through; }
.gt-lab .tog { width: 22px; height: 22px; padding: 0; border: 0; background: none; color: var(--muted); border-radius: 4px; flex: none; }
.gt-lab .tog:hover, .gt-lab .addsm:hover { background: var(--surface-2); color: var(--fg); }
.gt-lab .addsm { border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 3px 6px; border-radius: 4px; flex: none; }
.gt-lab .check { flex: none; margin: 0; }
.gt-track { position: relative; overflow: hidden;
  background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to right, transparent calc(var(--dw) * 5), color-mix(in srgb, var(--surface-2) 70%, transparent) calc(var(--dw) * 5));
  background-size: calc(var(--dw) * 7) 100%; }
.gt.zoom-month .gt-track { background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(var(--dw) * 28) 100%; }
.gt-scale { position: relative; height: 22px; overflow: hidden; }
.gt-scale span { position: absolute; top: 4px; white-space: nowrap; font-size: 12px; padding-left: 5px; }
.gt-scale.m span { font-weight: 600; border-left: 1px solid var(--muted); top: 2px; height: 20px; }
.gt-scale.w span { font: 11px var(--f-mono); color: var(--muted); }
.gt-scale.w span.we { opacity: .55; }
.gbar {
  --c: var(--muted);
  position: absolute; top: 9px; height: 22px; border-radius: 5px; z-index: 1;
  background: color-mix(in srgb, var(--c) 24%, var(--surface)); border: 1px solid var(--c);
  display: flex; align-items: center; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.gbar.dragging { cursor: grabbing; box-shadow: var(--shadow); z-index: 4; }
.gbar .prog { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--c) 62%, var(--surface)); }
.gbar .lbl { position: relative; padding: 0 8px; font: 500 11px var(--f-mono); white-space: nowrap; color: var(--fg); pointer-events: none; }
.gbar .h { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; z-index: 2; }
.gbar .h.l { left: 0; } .gbar .h.r { right: 0; }
.gbar .h::after { content: ""; position: absolute; top: 6px; bottom: 6px; left: 3px; width: 3px; border-radius: 2px; background: var(--c); opacity: 0; }
.gbar:hover .h::after, .gbar:focus-visible .h::after { opacity: .9; }
.gbar.summary { top: 13px; height: 14px; border-radius: 3px; background: var(--c); }
.gbar.summary .prog { background: color-mix(in srgb, var(--fg) 30%, var(--c)); }
.gbar.summary .lbl { display: none; }
.gbar.derived { border-style: dashed; background: color-mix(in srgb, var(--c) 18%, var(--surface)); cursor: pointer; }
.gms, .dia {
  --c: var(--muted);
  position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; padding: 0; z-index: 1;
  transform: rotate(45deg); border: 2px solid var(--c); background: var(--surface); border-radius: 2px;
}
.gms { cursor: grab; touch-action: pan-y; }
.gms.done, .dia.done { background: var(--c); }
.gms.late, .dia.late { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 25%, var(--surface)); }
.gt-links { position: absolute; top: 0; left: var(--lab); pointer-events: none; z-index: 2; }
.gt-links path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.gt-links path.bad { stroke: var(--danger); stroke-dasharray: 4 3; }
.gt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
.gt-today::before { content: "Today"; position: absolute; top: 26px; left: 5px; background: var(--surface); padding: 0 3px; font: 600 10px var(--f-mono); color: var(--danger); text-transform: uppercase; letter-spacing: .06em; }
.gt.zoom-day .gt-today::before { display: none; }
.gt-scale.w span.td { color: var(--danger); font-weight: 700; opacity: 1; }
.navgrp { display: inline-flex; gap: 8px; }
@media (pointer: coarse) { .gbar .h { width: 16px; } .gbar .h::after { opacity: .6; left: 6px; } }
.gt-empty { padding: 28px 20px; display: grid; gap: 12px; justify-items: start; color: var(--muted); max-width: 60ch; }
.gt-select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 6px; }
.legend .dia { position: static; margin: 0 8px 0 3px; width: 11px; height: 11px; }
.legend .lb { width: 26px; height: 12px; border-radius: 3px; border: 1px solid var(--muted); background: linear-gradient(to right, color-mix(in srgb, var(--muted) 62%, var(--surface)) 50%, color-mix(in srgb, var(--muted) 24%, var(--surface)) 50%); }
.legend svg { vertical-align: -3px; margin-right: 6px; }
.legend .tip { flex-basis: 100%; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 22, .45); display: grid; place-items: center; padding: 16px; }
.sheet {
  width: min(520px, 100%); max-height: calc(100% - 16px); overflow: auto;
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px;
}
.sheet h2 { font-size: 22px; margin-bottom: 14px; }
form.f { display: grid; gap: 12px; }
.f label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font-weight: 400; font-size: 15px;
}
.f textarea { resize: vertical; }
.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f .hint { margin: -6px 0 0; font-size: 12px; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; inset: 0; }
.swatches span { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches input:checked + span { box-shadow: 0 0 0 2px var(--fg); }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- responsive ---------- */

}

}

<body>
<div class="app">

</button>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'tidemark.v1', UIKEY = 'tidemark.ui';
const COLORS = ['#3b82c4', '#2f9e78', '#d08a1f', '#c2477a', '#7c5cc4', '#d0573a', '#4a8f9e'];
const STATUS = [['todo', 'To do'], ['doing', 'In progress'], ['done', 'Done']];
const PRI = { high: 'High', med: 'Medium', low: 'Low' };
const ICONS = {
  calendar: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  projects: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="16.5" y="4" width="4" height="13" rx="1.5"/></svg>',
  timeline: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M8 12h11M4 18h7"/></svg>',
  data: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3 2.8 7 2.8s7-1.3 7-2.8"/></svg>',
};
const VIEWS = [['calendar', 'Calendar'], ['projects', 'Projects'], ['timeline', 'Gantt']];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const todayStr = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isValidDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const longDate = d => fmt(d, { weekday: 'long', day: 'numeric', month: 'long' });
const shortDate = s => fmt(parse(s), { day: 'numeric', month: 'short' });
function relDays(ds) {
  const n = daysBetween(todayStr(), ds);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  return n > 0 ? `in ${n} days` : `${-n} days ago`;
}

/* ---------- storage ---------- */
function sample() {
  const t = new Date(), d = n => ymd(addDays(t, n));
  const p1 = uid(), p2 = uid(), p3 = uid();
  return {
    sample: true,
    projects: [
      { id: p1, name: 'Website relaunch', color: COLORS[0], start: d(-10), due: d(24), notes: 'New landing page, blog migration and analytics.' },
      { id: p2, name: 'Kitchen renovation', color: COLORS[2], start: d(-3), due: d(45), notes: 'Budget 12,000. Contractor starts once the permit is approved.' },
      { id: p3, name: 'Q4 report', color: COLORS[4], start: d(2), due: d(16), notes: '' },
    ],
    tasks: (() => {
      const id = {}; ['theme', 'copy', 'migrate', 'analytics', 'launch', 'permit', 'cabinet', 'appliances', 'demo', 'install', 'figures', 'slides', 'board'].forEach(k => { id[k] = uid(); });
      return [
        { id: id.theme, title: 'Pick blog theme', projectId: p1, status: 'done', priority: 'med', start: d(-9), due: d(-2) },
        { id: id.copy, title: 'Write homepage copy', projectId: p1, status: 'doing', priority: 'high', start: d(-3), due: d(2) },
        { id: id.migrate, title: 'Migrate 40 blog posts', projectId: p1, status: 'todo', priority: 'med', start: d(3), due: d(12), deps: [id.theme] },
        { id: id.analytics, title: 'Set up analytics', projectId: p1, status: 'todo', priority: 'low', start: d(13), due: d(20), deps: [id.migrate] },
        { id: id.launch, title: 'Go live', projectId: p1, status: 'todo', priority: 'high', due: d(24), deps: [id.copy, id.analytics] },
        { id: id.permit, title: 'Submit permit application', projectId: p2, status: 'done', priority: 'high', start: d(-3), due: d(-1) },
        { id: id.cabinet, title: 'Choose cabinet finish', projectId: p2, status: 'doing', priority: 'med', start: d(0), due: d(6), deps: [id.permit] },
        { id: id.appliances, title: 'Order appliances', projectId: p2, status: 'todo', priority: 'high', start: d(5), due: d(9), deps: [id.cabinet] },
        { id: id.demo, title: 'Demolition', projectId: p2, status: 'todo', priority: 'med', start: d(12), due: d(16), deps: [id.permit] },
        { id: id.install, title: 'Install cabinets', projectId: p2, status: 'todo', priority: 'med', start: d(20), due: d(30), deps: [id.demo, id.appliances] },
        { id: id.figures, title: 'Collect sales figures', projectId: p3, status: 'todo', priority: 'high', start: d(2), due: d(5) },
        { id: id.slides, title: 'Draft summary slides', projectId: p3, status: 'todo', priority: 'med', start: d(6), due: d(11), deps: [id.figures] },
        { id: id.board, title: 'Present to the board', projectId: p3, status: 'todo', priority: 'high', due: d(16), deps: [id.slides] },
        { id: uid(), title: 'Renew passport', projectId: '', status: 'todo', priority: 'med', due: d(-2) },
      ];
    })(),
    events: [
      { id: uid(), title: 'Design review', date: d(0), start: '10:00', end: '11:00', projectId: p1 },
      { id: uid(), title: 'Dentist', date: d(1), start: '08:30', end: '09:15', projectId: '' },
      { id: uid(), title: 'Report kickoff', date: d(2), start: '13:00', end: '13:30', projectId: p3 },
      { id: uid(), title: 'Contractor site visit', date: d(3), start: '14:00', end: '15:00', projectId: p2 },
      { id: uid(), title: 'Team offsite', date: d(8), endDate: d(9), start: '', end: '', projectId: '' },
      { id: uid(), title: 'Launch rehearsal', date: d(22), start: '16:00', end: '17:00', projectId: p1 },
    ],
  };
}
function normalize(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  const str = v => (typeof v === 'string' ? v : '');
  const date = v => (isValidDate(v) ? v : '');
  return {
    sample: !!s.sample,
    projects: (Array.isArray(s.projects) ? s.projects : []).filter(p => p && p.name).map(p => ({
      id: str(p.id) || uid(), name: str(p.name), color: COLORS.includes(p.color) ? p.color : COLORS[0],
      start: date(p.start), due: date(p.due), notes: str(p.notes),
    })),
    tasks: (Array.isArray(s.tasks) ? s.tasks : []).filter(t => t && t.title).map(t => ({
      id: str(t.id) || uid(), title: str(t.title), projectId: str(t.projectId),
      status: ['todo', 'doing', 'done'].includes(t.status) ? t.status : 'todo',
      priority: PRI[t.priority] ? t.priority : 'med', start: date(t.start), due: date(t.due), notes: str(t.notes),
      deps: Array.isArray(t.deps) ? t.deps.filter(v => typeof v === 'string') : [],
    })),
    events: (Array.isArray(s.events) ? s.events : []).filter(e => e && e.title && isValidDate(e.date)).map(e => ({
      id: str(e.id) || uid(), title: str(e.title), date: e.date, endDate: date(e.endDate),
      start: str(e.start), end: str(e.end), projectId: str(e.projectId), notes: str(e.notes),
    })),
  };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  return normalize(sample());
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* storage unavailable */ } }
function saveUI() { try { localStorage.setItem(UIKEY, JSON.stringify({ view: ui.view, calMode: ui.calMode, projectId: ui.projectId, zoom: ui.zoom, ganttProject: ui.ganttProject })); } catch (e) {} }
function loadUI() { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } }

let db = load();
const now = new Date();
const ui = Object.assign({ view: 'calendar', calMode: 'month', projectId: 'all', zoom: 'week', ganttProject: 'all' }, loadUI(), {
  collapsed: new Set(),
  month: ymd(new Date(now.getFullYear(), now.getMonth(), 1)),
  selected: todayStr(),
  tlStart: ymd(addDays(mondayOf(now), -14)),
});
if (!VIEWS.some(v => v[0] === ui.view)) ui.view = 'calendar';

const proj = id => db.projects.find(p => p.id === id);
const colorOf = id => proj(id)?.color || 'var(--muted)';
const projLabel = id => { const p = proj(id); return p ? `<span class="pdot" style="--c:${p.color}">${esc(p.name)}</span>` : ''; };
function itemsOn(ds) {
  const ev = db.events.filter(e => e.date <= ds && ds <= (e.endDate || e.date))
    .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const tk = db.tasks.filter(t => t.due === ds);
  const dl = db.projects.filter(p => p.due === ds);
  return { ev, tk, dl };
}
const isLate = t => t.status !== 'done' && t.due && t.due < todayStr();

/* ---------- rendering ---------- */
const main = $('#main');
function render() {
  $('#nav').innerHTML = VIEWS.map(([k, n]) =>
    `<button data-act="view" data-view="${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${ICONS[k]}${n}</button>`).join('');
  $('#tabbar').innerHTML = VIEWS.map(([k, n]) =>
    `<button data-act="view" data-view="${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${ICONS[k]}${n}</button>`).join('')
    + `<button data-act="data">${ICONS.data}Data</button>`;
  renderSummary();
  const banner = db.sample ? `<div class="banner"><span>These projects, tasks and events are examples so you can see how things work.</span>
    <button class="btn sm" data-act="keep-sample">Keep them</button><button class="btn sm primary" data-act="clear-all">Clear examples and start fresh</button></div>` : '';
  const prevScroll = $('#gt-wrap')?.scrollLeft || 0;
  const body = ui.view === 'projects' ? renderProjects() : ui.view === 'timeline' ? renderGantt() : renderCalendar();
  main.innerHTML = banner + body;
  const wrap = $('#gt-wrap');
  if (wrap) {
    const todayEl = wrap.querySelector('.gt-today'), lab = wrap.querySelector('.gt-lab')?.offsetWidth || 0;
    if (ui.gtScroll === 'today' && todayEl) wrap.scrollLeft = Math.max(0, todayEl.offsetLeft - lab - (wrap.clientWidth - lab) * 0.2);
    else if (ui.gtScroll === 'start') wrap.scrollLeft = 0;
    else wrap.scrollLeft = prevScroll;
  }
  ui.gtScroll = null;
}

function renderSummary() {
  const t = todayStr();
  const today = itemsOn(t);
  const late = db.tasks.filter(isLate).length;
  const weekEnd = ymd(addDays(new Date(), 7));
  const week = db.tasks.filter(x => x.status !== 'done' && x.due && x.due >= t && x.due <= weekEnd).length;
  $('#summary').innerHTML = `<div class="eyebrow" style="padding-left:4px">${esc(fmt(new Date(), { weekday: 'long', day: 'numeric', month: 'long' }))}</div>
    <button class="stat" data-act="goto-today"><span>Today</span><b>${today.ev.length + today.tk.length}</b></button>
    <button class="stat" data-act="goto-agenda"><span>Due next 7 days</span><b>${week}</b></button>
    <button class="stat ${late ? 'alert' : ''}" data-act="goto-agenda"><span>Overdue</span><b>${late}</b></button>`;
}

function chip(kind, o) {
  if (kind === 'event') {
    return `<button class="chip ev" data-act="edit-event" data-id="${o.id}" style="--c:${colorOf(o.projectId)}">${o.start ? `<b>${o.start}</b> ` : ''}${esc(o.title)}</button>`;
  }
  if (kind === 'task') {
    return `<button class="chip tk ${o.status === 'done' ? 'done' : ''}" data-act="edit-task" data-id="${o.id}" style="--c:${colorOf(o.projectId)}"><span class="box"></span>${esc(o.title)}</button>`;
  }
  return `<button class="chip dl" data-act="edit-project" data-id="${o.id}" style="--c:${o.color}">Due: ${esc(o.name)}</button>`;
}

function renderCalendar() {
  const m = parse(ui.month);
  const isMonth = ui.calMode === 'month';
  const sub = isMonth
    ? `Weeks ${isoWeek(m)}–${isoWeek(new Date(m.getFullYear(), m.getMonth() + 1, 0))}`
    : 'Everything coming up in the next 60 days';
  return `<header class="vh">
      <div><div class="eyebrow">Calendar</div><h1>${isMonth ? esc(fmt(m, { month: 'long', year: 'numeric' })) : 'Agenda'}</h1><p class="sub">${sub}</p></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Calendar layout">
          <button data-act="cal-mode" data-mode="month" aria-pressed="${isMonth}">Month</button>
          <button data-act="cal-mode" data-mode="agenda" aria-pressed="${!isMonth}">Agenda</button>
        </div>
        ${isMonth ? `<button class="btn icon-btn" data-act="prev" aria-label="Previous month">‹</button>
        <button class="btn" data-act="today">Today</button>
        <button class="btn icon-btn" data-act="next" aria-label="Next month">›</button>` : ''}
      </div>
    </header>
    ${isMonth ? `<div class="cal">${renderMonth()}${renderDayPanel()}</div>` : renderAgenda()}`;
}

function renderMonth() {
  const m = parse(ui.month), mo = m.getMonth();
  const offset = (m.getDay() + 6) % 7, start = addDays(m, -offset);
  const dim = new Date(m.getFullYear(), mo + 1, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7);
  const t = todayStr();
  const ref = new Date(2024, 0, 1); // a Monday
  let h = '<div class="month" role="grid" aria-label="Month"><div class="wk-h" title="ISO week number">Wk</div>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ref, i);
    h += `<div class="dow" role="columnheader">${esc(fmt(d, { weekday: window.innerWidth < 640 ? 'narrow' : 'short' }))}</div>`;
  }
  for (let w = 0; w < weeks; w++) {
    h += `<div class="wk">${isoWeek(addDays(start, w * 7))}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i), ds = ymd(d), { ev, tk, dl } = itemsOn(ds);
      const cls = ['day', d.getMonth() !== mo && 'out', ds === t && 'today', ds === ui.selected && 'sel', i >= 5 && 'wkend'].filter(Boolean).join(' ');
      const all = [...dl.map(p => chip('deadline', p)), ...ev.map(e => chip('event', e)), ...tk.map(x => chip('task', x))];
      const shown = all.slice(0, 3), more = all.length - shown.length;
      const dots = [...dl.map(p => p.color), ...ev.map(e => colorOf(e.projectId)), ...tk.map(x => colorOf(x.projectId))].slice(0, 4);
      h += `<div class="${cls}" role="gridcell" tabindex="0" data-act="select-day" data-date="${ds}" aria-label="${esc(longDate(d))}, ${all.length} item${all.length === 1 ? '' : 's'}">
        <span class="num">${d.getDate()}</span>
        <div class="chips">${shown.join('')}${more ? `<span class="more">+${more} more</span>` : ''}</div>
        <div class="dots">${dots.map(c => `<i style="background:${c}"></i>`).join('')}</div>
      </div>`;
    }
  }
  return h + '</div>';
}

function itemRows(ds, { ev, tk, dl }) {
  const rows = [];
  dl.forEach(p => rows.push(`<li class="item"><span class="when">Deadline</span><div class="what">
    <button class="t" data-act="edit-project" data-id="${p.id}">${esc(p.name)} is due</button>
    <div class="meta"><span class="pdot" style="--c:${p.color}">Project</span></div></div></li>`));
  ev.forEach(e => {
    const multi = e.endDate && e.endDate !== e.date;
    const when = e.start ? `${e.start}${e.end ? `<br>${e.end}` : ''}` : 'All day';

/* ---------- gantt ---------- */
const ZOOM = { day: { dw: 30, days: 42, label: 'Days' }, week: { dw: 16, days: 98, label: 'Weeks' }, month: { dw: 5, days: 364, label: 'Months' } };
const ROW = 40, HEAD = 44;
function taskSpan(t) {

  const sp = db.tasks.filter(t => t.projectId === p.id).map(taskSpan).filter(Boolean);

const tasksOf = pid => db.tasks.filter(t => (pid ? t.projectId === pid : !proj(t.projectId)))

  db.tasks.filter(t => sel === 'all' || (sel === 'none' ? !proj(t.projectId) : t.projectId === sel)).forEach(t => { const sp = taskSpan(t); if (sp) spans.push(sp); });

        <button class="check ${done ? 'on' : ''}" style="--c:${c}" data-act="toggle-task" data-id="${t.id}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(t.title)}"></button>

  let links = '';
  rows.forEach(r => {

function shiftDates(kind, id, mode, n) {

    else if (mode === 'start') { const ns = sh(sp.s); t.start = ns > sp.e ? sp.e : ns; t.due = sp.e; }
    else { const ne = sh(sp.e); t.due = ne < sp.s ? sp.s : ne; t.start = sp.s; }
  } else {
    const p = proj(id); if (!p || !(p.start || p.due)) return false;
    const sp = projSpan(p);

      db.tasks.forEach(t => { if (t.projectId === id) { if (t.start) t.start = sh(t.start); if (t.due) t.due = sh(t.due); } });
    } else if (mode === 'start') { const ns = sh(sp.s); p.start = ns > sp.e ? sp.e : ns; p.due = sp.e; }
    else { const ne = sh(sp.e); p.due = ne < sp.s ? sp.s : ne; p.start = sp.s; }

}
function refocusBar(kind, id) { main.querySelector(`.gt [data-kind="${kind}"][data-id="${id}"]`)?.focus({ preventScroll: true }); }
function rangeText(kind, id) {
  const sp = kind === 'task' ? taskSpan(db.tasks.find(o => o.id === id)) : projSpan(proj(id));
  return sp ? (sp.s === sp.e ? shortDate(sp.s) : `${shortDate(sp.s)} → ${shortDate(sp.e)}`) : '';
}

/* ---------- forms ---------- */
const sheet = $('#sheet'), modal = $('#modal');
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  sheet.innerHTML = html;
  modal.hidden = false;
  const f = sheet.querySelector('input:not([type=radio]), select, textarea, button');
  if (f) f.focus();
}
function closeModal() { modal.hidden = true; sheet.innerHTML = ''; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200);
}
const projOptions = sel => `<option value="">No project</option>` + db.projects.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
const actions = (kind, id, extra = '') => `<div class="actions">${id ? `<button type="button" class="btn danger" data-act="delete" data-kind="${kind}" data-id="${id}">Delete</button>` : ''}${extra}
  <span class="grow"></span><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div>`;

function eventForm(e) {
  return `<h2>${e.id ? 'Edit event' : 'New event'}</h2>
  <form class="f" data-kind="event" data-id="${e.id || ''}">
    <label>Title<input id="f-title" name="title" required maxlength="140" value="${esc(e.title)}" placeholder="e.g. Client call"></label>
    <div class="two"><label>Date<input id="f-date" type="date" name="date" required value="${esc(e.date)}"></label>
      <label>Ends on (optional)<input id="f-enddate" type="date" name="endDate" value="${esc(e.endDate)}"></label></div>
    <div class="two"><label>Start time<input id="f-start" type="time" name="start" value="${esc(e.start)}"></label>
      <label>End time<input id="f-end" type="time" name="end" value="${esc(e.end)}"></label></div>
    <p class="hint">Leave the times empty for an all-day event.</p>
    <label>Project<select id="f-project" name="projectId">${projOptions(e.projectId)}</select></label>
    <label>Notes<textarea id="f-notes" name="notes" rows="3">${esc(e.notes)}</textarea></label>
    ${actions('event', e.id)}
  </form>`;
}
function depsField(id, deps, projectId) {
  const others = projectId ? db.tasks.filter(t => t.id !== id && t.projectId === projectId) : [];
  if (!others.length) return '<p class="hint" style="margin:0">Tasks in the same project can be linked here, so this one starts after them.</p>';
  return `<div class="eyebrow" style="margin-bottom:6px">Starts after</div><div class="deps">${others.map(t =>
    `<label class="dep"><input type="checkbox" name="deps" value="${t.id}" ${deps.includes(t.id) ? 'checked' : ''}><span>${esc(t.title)}</span></label>`).join('')}</div>
    <p class="hint" style="margin:6px 0 0">If you leave the start date empty, it is set to the day after these finish.</p>`;
}
function taskForm(x) {
  return `<h2>${x.id ? 'Edit task' : 'New task'}</h2>
  <form class="f" data-kind="task" data-id="${x.id || ''}">
    <label>Task<input id="f-title" name="title" required maxlength="140" value="${esc(x.title)}" placeholder="e.g. Send invoice"></label>
    <label>Project<select id="f-project" name="projectId">${projOptions(x.projectId)}</select></label>
    <div class="two"><label>Start date<input id="f-tstart" type="date" name="start" value="${esc(x.start)}"></label>
      <label>Due date<input id="f-due" type="date" name="due" value="${esc(x.due)}"></label></div>
    <p class="hint">Give a start and due date to show this task as a bar on the Gantt chart. A due date alone shows it as a milestone.</p>
    <div id="f-deps">${depsField(x.id, x.deps || [], x.projectId)}</div>
    <div class="two"><label>Status<select id="f-status" name="status">${STATUS.map(([k, n]) => `<option value="${k}" ${x.status === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>Priority<select id="f-priority" name="priority">${Object.entries(PRI).map(([k, n]) => `<option value="${k}" ${x.priority === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <label>Notes<textarea id="f-notes" name="notes" rows="3">${esc(x.notes)}</textarea></label>
    ${actions('task', x.id)}
  </form>`;
}
function projectForm(p) {
  return `<h2>${p.id ? 'Edit project' : 'New project'}</h2>
  <form class="f" data-kind="project" data-id="${p.id || ''}">
    <label>Name<input id="f-title" name="name" required maxlength="80" value="${esc(p.name)}" placeholder="e.g. Garden makeover"></label>
    <div class="two"><label>Start<input id="f-start" type="date" name="start" value="${esc(p.start)}"></label>
      <label>Deadline<input id="f-due" type="date" name="due" value="${esc(p.due)}"></label></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Color</div><div class="swatches">${COLORS.map((c, i) => `<label><input type="radio" name="color" value="${c}" ${p.color === c ? 'checked' : ''} aria-label="Color ${i + 1}"><span style="--c:${c}"></span></label>`).join('')}</div></div>
    <label>Notes<textarea id="f-notes" name="notes" rows="3">${esc(p.notes)}</textarea></label>
    ${p.id ? '<p class="hint" style="margin:0">Deleting a project keeps its tasks and events; they become unassigned.</p>' : ''}
    ${actions('project', p.id)}
  </form>`;
}

function defaultDate() { return ui.view === 'calendar' && ui.calMode === 'month' ? ui.selected : todayStr(); }
function newEvent(date) { openModal(eventForm({ title: '', date: date || defaultDate(), endDate: '', start: '', end: '', projectId: ui.view === 'projects' && proj(ui.projectId) ? ui.projectId : '', notes: '' })); }
function newTask(o = {}) {
  const ctx = ui.view === 'timeline' ? ui.ganttProject : ui.projectId;
  const projectId = o.projectId ?? (proj(ctx) ? ctx : '');
  const inGantt = ui.view === 'timeline';
  openModal(taskForm({ title: '', projectId, status: o.status || 'todo', priority: 'med', deps: [],
    start: inGantt ? todayStr() : '', due: o.due || (inGantt ? ymd(addDays(new Date(), 4)) : ''), notes: '' }));
}
function newProject() {
  const used = new Set(db.projects.map(p => p.color));
  openModal(projectForm({ name: '', color: COLORS.find(c => !used.has(c)) || COLORS[db.projects.length % COLORS.length], start: todayStr(), due: '', notes: '' }));
}

function onSubmit(form) {
  const raw = new FormData(form), fd = Object.fromEntries(raw);
  const kind = form.dataset.kind, id = form.dataset.id;
  for (const k in fd) if (typeof fd[k] === 'string') fd[k] = fd[k].trim();
  let list, item;
  if (kind === 'event') {
    if (fd.endDate && fd.endDate <= fd.date) fd.endDate = '';
    if (fd.end && (!fd.start || fd.end <= fd.start)) fd.end = '';
    list = db.events; item = { title: fd.title, date: fd.date, endDate: fd.endDate, start: fd.start, end: fd.end, projectId: fd.projectId, notes: fd.notes };
  } else if (kind === 'task') {
    const deps = fd.projectId ? raw.getAll('deps').filter(d => db.tasks.some(t => t.id === d && t.projectId === fd.projectId)) : [];
    if (!fd.start && deps.length) {
      const ends = deps.map(d => taskSpan(db.tasks.find(t => t.id === d))?.e).filter(Boolean).sort();
      if (ends.length) fd.start = ymd(addDays(parse(ends.pop()), 1));
      if (fd.start && fd.due && fd.due < fd.start) fd.due = '';
    }
    if (fd.start && fd.due && fd.due < fd.start) { const t = fd.start; fd.start = fd.due; fd.due = t; }
    list = db.tasks; item = { title: fd.title, projectId: fd.projectId, start: fd.start, due: fd.due, deps, status: fd.status, priority: fd.priority, notes: fd.notes };
  } else {
    if (fd.start && fd.due && fd.due < fd.start) { const s = fd.start; fd.start = fd.due; fd.due = s; }
    list = db.projects; item = { name: fd.name, color: fd.color || COLORS[0], start: fd.start, due: fd.due, notes: fd.notes };
  }
  if (id) Object.assign(list.find(o => o.id === id), item);
  else { item.id = uid(); list.push(item); if (kind === 'project' && ui.view === 'projects') ui.projectId = item.id; }
  if (kind === 'event' && ui.view === 'calendar') { ui.selected = item.date; ui.month = ui.month.slice(0, 8) === item.date.slice(0, 8) ? ui.month : item.date.slice(0, 8) + '01'; }
  save(); closeModal(); render(); toast(id ? 'Saved' : `${kind[0].toUpperCase() + kind.slice(1)} added`);
}

function dataSheet() {
  const json = JSON.stringify({ app: 'tidemark', version: 1, exported: new Date().toISOString(), ...db }, null, 2);
  const canDownload = window.self === window.top;
  openModal(`<h2>Backup &amp; data</h2>
    <p class="muted" style="margin-top:-6px">Your planner is saved in this browser on this device. Copy a backup to move it to another device or keep it safe.</p>
    <label class="f" style="display:grid;gap:6px"><span class="eyebrow">Backup</span><textarea id="d-export" class="datatext f" readonly>${esc(json)}</textarea></label>
    <div class="actions"><button class="btn primary" data-act="copy-export">Copy backup</button>${canDownload ? '<button class="btn" data-act="download-export">Download file</button>' : ''}</div>
    <hr>
    <div class="eyebrow">Restore</div>
    <p class="muted" style="margin:4px 0 8px">Paste a backup or choose a backup file. This replaces everything currently in the planner.</p>
    <div class="f" style="display:grid;gap:8px">
      <textarea id="d-import" class="datatext" placeholder="Paste backup here"></textarea>
      <input id="d-file" type="file" accept="application/json,.json">
    </div>
    <div class="actions"><button class="btn" data-act="do-import">Restore backup</button></div>
    <hr>
    <div class="actions"><button class="btn" data-act="load-sample">Load examples</button><button class="btn danger" data-act="wipe">Erase everything</button><span class="grow"></span><button class="btn" data-act="close">Done</button></div>`);
}

function armOrRun(btn, label, fn) {
  if (btn.classList.contains('armed')) { fn(); return; }
  btn.classList.add('armed'); btn.dataset.label = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = btn.dataset.label; } }, 4000);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (ev.target === modal) { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'view': ui.view = el.dataset.view; ui.gtScroll = 'today'; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'cal-mode': ui.calMode = el.dataset.mode; saveUI(); render(); break;
    case 'prev': case 'next': {
      const m = parse(ui.month); ui.month = ymd(new Date(m.getFullYear(), m.getMonth() + (act === 'next' ? 1 : -1), 1)); render(); break;
    }
    case 'today': case 'goto-today': {
      const n = new Date(); ui.view = 'calendar'; ui.calMode = 'month'; ui.selected = todayStr(); ui.month = ymd(new Date(n.getFullYear(), n.getMonth(), 1)); saveUI(); render(); break;
    }
    case 'goto-agenda': ui.view = 'calendar'; ui.calMode = 'agenda'; saveUI(); render(); break;
    case 'select-day': {
      ui.selected = el.dataset.date;
      const d = parse(ui.selected), m = parse(ui.month);
      if (d.getMonth() !== m.getMonth()) ui.month = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
      render();
      if (window.innerWidth <= 1100) $('#daypanel')?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      break;
    }
    case 'quick-add': openModal(`<h2>Add to your planner</h2><div class="choice">
        <button data-act="new-event"><b>Event</b><span>A meeting, appointment or trip on the calendar</span></button>
        <button data-act="new-task"><b>Task</b><span>Something to get done, with a due date and status</span></button>
        <button data-act="new-project"><b>Project</b><span>A goal with a deadline that groups tasks</span></button></div>
        <div class="actions"><span class="grow"></span><button class="btn" data-act="close">Cancel</button></div>`); break;
    case 'new-event': newEvent(el.dataset.date); break;
    case 'new-task': newTask({ due: el.dataset.date, status: el.dataset.status, projectId: el.dataset.project }); break;
    case 'new-project': newProject(); break;
    case 'edit-event': { const o = db.events.find(x => x.id === id); if (o) openModal(eventForm(o)); break; }
    case 'edit-task': { const o = db.tasks.find(x => x.id === id); if (o) openModal(taskForm(o)); break; }
    case 'edit-project': { const o = proj(id); if (o) openModal(projectForm(o)); break; }
    case 'toggle-task': { const o = db.tasks.find(x => x.id === id); if (o) { o.status = o.status === 'done' ? 'todo' : 'done'; save(); render(); } break; }
    case 'move-task': { const o = db.tasks.find(x => x.id === id); if (o) { o.status = el.dataset.to; save(); render(); } break; }
    case 'pick-project': ui.projectId = id; saveUI(); render(); break;
    case 'open-board': ui.view = 'projects'; ui.projectId = id; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'tl-prev': case 'tl-next': {
      const step = { day: 14, week: 28, month: 91 }[ui.zoom] || 28;
      ui.tlStart = ymd(addDays(parse(ui.tlStart), act === 'tl-next' ? step : -step)); ui.gtScroll = 'start'; render(); break;
    }
    case 'tl-today': ui.gtScroll = 'today'; ui.tlStart = ymd(addDays(mondayOf(new Date()), ui.zoom === 'month' ? -28 : -7)); render(); break;
    case 'gt-zoom': ui.zoom = el.dataset.zoom; ui.gtScroll = 'today'; saveUI(); render(); break;
    case 'gt-fit': fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); break;
    case 'gt-toggle': if (ui.collapsed.has(id)) ui.collapsed.delete(id); else ui.collapsed.add(id); render(); break;
    case 'open-gantt': ui.view = 'timeline'; ui.ganttProject = id; fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'close': closeModal(); break;
    case 'delete': armOrRun(el, 'Click again to delete', () => {
      const kind = el.dataset.kind;
      if (kind === 'event') db.events = db.events.filter(x => x.id !== id);
      if (kind === 'task') { db.tasks = db.tasks.filter(x => x.id !== id); db.tasks.forEach(x => { x.deps = x.deps.filter(d => d !== id); }); }
      if (kind === 'project') {
        db.projects = db.projects.filter(x => x.id !== id);
        db.tasks.forEach(x => { if (x.projectId === id) x.projectId = ''; });
        db.events.forEach(x => { if (x.projectId === id) x.projectId = ''; });
        if (ui.projectId === id) ui.projectId = 'all';
      }
      save(); closeModal(); render(); toast('Deleted');
    }); break;
    case 'keep-sample': db.sample = false; save(); render(); break;
    case 'clear-all': db = normalize({}); save(); ui.projectId = 'all'; render(); toast('Examples cleared'); break;
    case 'data': dataSheet(); break;
    case 'copy-export': {
      const ta = $('#d-export');
      const fallback = () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C or Cmd+C to copy'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => toast('Backup copied'), fallback); else fallback();
      break;
    }
    case 'download-export': {
      const blob = new Blob([$('#d-export').value], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tidemark-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'do-import': {
      const fileIn = $('#d-file'), text = $('#d-import').value.trim();
      const apply = raw => {
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.events)) throw new Error('shape');
          db = normalize({ ...parsed, sample: false }); save(); ui.projectId = 'all'; closeModal(); render(); toast('Backup restored');
        } catch (e) { toast('That is not a Tidemark backup. Check you copied all of it.'); }
      };
      if (text) apply(text);
      else if (fileIn.files[0]) fileIn.files[0].text().then(apply);
      else toast('Paste a backup or choose a file first');
      break;
    }
    case 'load-sample': db = normalize(sample()); save(); ui.projectId = 'all'; closeModal(); render(); toast('Examples loaded'); break;
    case 'wipe': armOrRun(el, 'Click again to erase', () => { db = normalize({}); save(); ui.projectId = 'all'; closeModal(); render(); toast('Planner erased'); }); break;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'gt-project') { ui.ganttProject = ev.target.value; fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); return; }
  const form = ev.target.closest('form.f[data-kind="task"]');
  if (form && ev.target.id === 'f-project') {
    const keep = [...form.querySelectorAll('input[name=deps]:checked')].map(i => i.value);
    $('#f-deps').innerHTML = depsField(form.dataset.id, keep, ev.target.value);
  }
});
document.addEventListener('submit', ev => { const f = ev.target.closest('form.f'); if (!f) return; ev.preventDefault(); onSubmit(f); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !modal.hidden) { closeModal(); return; }
  const bar = ev.target.closest?.('.gt [data-kind][data-id]');
  if (bar && ev.target === bar) {
    const { kind, id } = bar.dataset;
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEditor(kind, id); return; }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      ev.preventDefault();
      const mode = ev.shiftKey && !bar.classList.contains('gms') ? 'end' : 'move';
      if (shiftDates(kind, id, mode, ev.key === 'ArrowRight' ? 1 : -1)) { save(); render(); refocusBar(kind, id); toast(rangeText(kind, id)); }
      return;
    }
  }
  const day = ev.target.closest?.('.day');
  if (day && ev.target === day && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); day.click(); }
});

/* drag and drop on the board */
main.addEventListener('dragstart', ev => {
  const c = ev.target.closest('.card[data-id]'); if (!c) return;
  ev.dataTransfer.setData('text/plain', c.dataset.id); ev.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
main.addEventListener('dragend', ev => { ev.target.closest?.('.card')?.classList.remove('dragging'); main.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
main.addEventListener('dragover', ev => { const col = ev.target.closest('.col[data-status]'); if (!col) return; ev.preventDefault(); col.classList.add('over'); });
main.addEventListener('dragleave', ev => { const col = ev.target.closest('.col'); if (col && !col.contains(ev.relatedTarget)) col.classList.remove('over'); });
main.addEventListener('drop', ev => {
  const col = ev.target.closest('.col[data-status]'); if (!col) return;
  ev.preventDefault();
  const o = db.tasks.find(x => x.id === ev.dataTransfer.getData('text/plain'));
  if (o && o.status !== col.dataset.status) { o.status = col.dataset.status; save(); }
  render();
});

/* gantt: drag bars to reschedule */
function openEditor(kind, id) {
  if (kind === 'task') { const o = db.tasks.find(x => x.id === id); if (o) openModal(taskForm(o)); }
  else { const o = proj(id); if (o) openModal(projectForm(o)); }
}
let drag = null;
main.addEventListener('pointerdown', ev => {
  const bar = ev.target.closest('.gt [data-kind][data-id]');
  if (!bar || ev.button > 0) return;
  const h = ev.target.closest('.h');
  const dw = parseFloat(getComputedStyle(bar.closest('.gt')).getPropertyValue('--dw')) || 16;
  drag = { bar, kind: bar.dataset.kind, id: bar.dataset.id, mode: h ? (h.classList.contains('l') ? 'start' : 'end') : 'move',
    x0: ev.clientX, left: parseFloat(bar.style.left), width: bar.offsetWidth, dw, moved: false, n: 0, pid: ev.pointerId };
  try { bar.setPointerCapture(ev.pointerId); } catch (e) {}
});
main.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.pid) return;
  const dx = ev.clientX - drag.x0;
  if (!drag.moved && Math.abs(dx) < 5) return;
  if (!drag.moved) { drag.moved = true; drag.bar.classList.add('dragging'); }
  const n = Math.round(dx / drag.dw); drag.n = n;
  const { bar, left, width, dw } = drag;
  if (drag.mode === 'move') bar.style.left = `${left + n * dw}px`;
  else if (drag.mode === 'start') { const k = Math.min(n, Math.round(width / dw) - 1); bar.style.left = `${left + k * dw}px`; bar.style.width = `${width - k * dw}px`; }
  else bar.style.width = `${Math.max(dw, width + n * dw)}px`;
});
function endDrag(ev, cancelled) {
  if (!drag || ev.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (!d.moved) { if (!cancelled) openEditor(d.kind, d.id); return; }
  if (!cancelled && shiftDates(d.kind, d.id, d.mode, d.n)) { save(); toast(rangeText(d.kind, d.id)); }
  render();
}
main.addEventListener('pointerup', ev => endDrag(ev, false));
main.addEventListener('pointercancel', ev => endDrag(ev, true));

/* keep in sync with other tabs, re-render on resize breakpoints and at midnight */
window.addEventListener('storage', ev => { if (ev.key === KEY) { db = load(); render(); } });
let lastNarrow = window.innerWidth < 640;
window.addEventListener('resize', () => { const n = window.innerWidth < 640; if (n !== lastNarrow) { lastNarrow = n; if (modal.hidden) render(); } });
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 60000);

ui.gtScroll = 'today';
render();

/* offline support + install when served as a standalone site */
if ('serviceWorker' in navigator && window.self === window.top && /^https:|^http:\/\/localhost/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
