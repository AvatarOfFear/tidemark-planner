<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tidemark">
<!--APP-HEAD-->
<title>Tidemark Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail (nav + summary) beside one working surface; on phones the rail becomes a bottom tab bar. */
:root {
  --bg: #f4f7f7;
  --surface: #ffffff;
  --surface-2: #eaf0f0;
  --line: #d5dfdf;
  --fg: #132426;
  --muted: #5a6c6e;
  --accent: #0e6b66;
  --accent-ink: #ffffff;
  --accent-soft: #d6ecea;
  --danger: #b3361f;
  --warn: #9a6200;
  --ok: #2c7a4b;
  --shadow: 0 1px 2px rgba(15, 40, 42, .06), 0 8px 24px rgba(15, 40, 42, .08);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --work: #2f5f8f;
  --personal: #a4476a;
  --rs: 1;
  --r: calc(10px * var(--rs));
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1617; --surface: #152022; --surface-2: #1c2a2c; --line: #2a3b3d;
    --fg: #e2ecec; --muted: #93a6a7; --accent: #4cc2b6; --accent-ink: #062422; --accent-soft: #173836;
    --danger: #ef7d64; --warn: #e2a74c; --ok: #6cc590;
    --work: #7fb0e0; --personal: #e58fae;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1617; --surface: #152022; --surface-2: #1c2a2c; --line: #2a3b3d;
  --fg: #e2ecec; --muted: #93a6a7; --accent: #4cc2b6; --accent-ink: #062422; --accent-soft: #173836;
  --danger: #ef7d64; --warn: #e2a74c; --ok: #6cc590;
  --work: #7fb0e0; --personal: #e58fae;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 0.9375rem/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; padding-inline: 6px; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: calc(8px * var(--rs)); background: none; text-align: left; font-weight: 500;
}
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.summary { display: grid; gap: 8px; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: calc(8px * var(--rs)); background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.stat b { font-family: var(--f-mono); font-size: 1.125rem; font-weight: 500; }
.stat.alert b { color: var(--danger); }
.side .spacer { flex: 1; }

main { min-width: 0; padding: 26px 28px 40px; }
.mtop { display: none; }
.tabbar, .fab { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: calc(8px * var(--rs)); border: 1px solid var(--line);
  background: var(--surface); font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; }
.btn.block { width: 100%; }
.btn.sm { padding: 5px 10px; font-size: 0.8125rem; }
.icon-btn { width: 36px; height: 36px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: calc(8px * var(--rs)); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* ---------- view header ---------- */
.vh { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin-bottom: 18px; }
.vh h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.05; }
.vh .sub { margin: 6px 0 0; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 14px; margin-bottom: 18px; border-radius: var(--r);
  background: var(--accent-soft); color: var(--fg); font-size: 0.875rem;
}
.banner span { flex: 1 1 220px; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.month {
  display: grid; grid-template-columns: 2.4rem repeat(7, minmax(0, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
}
.dow, .wk-h { padding: 8px 8px 6px; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.wk-h, .wk { text-align: center; }
.wk { font: 0.6875rem var(--f-mono); color: var(--muted); padding-top: 9px; border-top: 1px solid var(--line); background: var(--surface-2); }
.day {
  position: relative; min-height: 104px; padding: 6px; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0;
}
.day:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.day.wkend { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.day.out .num { color: var(--muted); opacity: .55; }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.num { font: 500 0.8125rem var(--f-mono); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.day.today .num { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip {
  --c: var(--muted);
  display: block; width: 100%; text-align: left; border: 0; border-radius: calc(4px * var(--rs));
  padding: 2px 6px; font-size: 0.75rem; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--fg);
  border-left: 3px solid var(--c);
}
.chip b { font: 500 0.6875rem var(--f-mono); }
.chip.tk { background: none; border-left: 0; padding-left: 2px; }
.chip.tk .box { display: inline-block; width: 9px; height: 9px; border: 1.5px solid var(--c); border-radius: calc(2px * var(--rs)); margin-right: 5px; vertical-align: -1px; }
.chip.tk.done { color: var(--muted); text-decoration: line-through; }
.chip.tk.done .box { background: var(--c); }
.chip.dl { background: none; border: 1px dashed var(--c); font-weight: 600; }
.more { font-size: 0.6875rem; color: var(--muted); padding-left: 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; padding-left: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.panel h2 { font-size: 1.25rem; }
.panel .add { display: flex; gap: 8px; margin-top: 14px; }
.items { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 6px; border-radius: calc(8px * var(--rs)); }
.item:hover { background: var(--surface-2); }
.item .when { font: 0.75rem var(--f-mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.item .what { min-width: 0; }
.item .t { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.pdot { display: inline-flex; align-items: center; gap: 5px; }
.pdot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.check {
  width: 18px; height: 18px; border-radius: calc(4px * var(--rs)); border: 1.5px solid var(--c, var(--muted)); background: none; padding: 0;
  display: inline-grid; place-items: center; margin-top: 1px;
}
.check.on { background: var(--c, var(--muted)); }
.check.on::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.item.task .when { display: flex; justify-content: flex-end; }
.item.ev .when { border-left: 3px solid var(--c, transparent); padding-left: 7px; }
.item.done .t { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); padding: 14px 6px; font-size: 0.875rem; }

.agenda { display: grid; gap: 18px; max-width: 760px; }
.agenda section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.agenda h3 { font-size: 1rem; display: flex; gap: 10px; align-items: baseline; }
.agenda h3 .mono { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
.agenda section.overdue h3 { color: var(--danger); }
.agenda .items { margin-top: 6px; }

/* ---------- projects ---------- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 22px; }
.pcard {
  --c: var(--muted);
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
  border-top: 4px solid var(--c); min-width: 0;
}
.pcard:hover { box-shadow: var(--shadow); }
.pcard[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: -1px; }
.pcard h3 { font-size: 1.0625rem; overflow-wrap: anywhere; }
.pcard .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8125rem; color: var(--muted); }
.bar { height: 6px; border-radius: calc(3px * var(--rs)); background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: calc(3px * var(--rs)); }
.late { color: var(--danger) !important; font-weight: 600; }
.soon { color: var(--warn) !important; font-weight: 600; }

.pdetail { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: -6px 0 18px; color: var(--muted); font-size: 0.875rem; }
.pdetail p { margin: 0; flex: 1 1 260px; max-width: 65ch; color: var(--fg); }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; min-height: 160px; border: 2px dashed transparent; transition: border-color .15s; }
.col.over { border-color: var(--accent); }
.col header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; }
.col header h3 { font-size: 0.9375rem; }
.col header .mono { font-size: 0.75rem; color: var(--muted); }
.cards { display: grid; gap: 8px; }
.card {
  --c: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: calc(8px * var(--rs)); padding: 10px 12px;
  display: grid; gap: 6px; cursor: grab; border-left: 3px solid var(--c);
}
.card.dragging { opacity: .45; }
.card .t { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; overflow-wrap: anywhere; }
.card.done .t { color: var(--muted); text-decoration: line-through; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.75rem; color: var(--muted); }
.card .move { margin-left: auto; border: 0; background: none; color: var(--accent); font-size: 0.75rem; font-weight: 600; padding: 2px 0; }
.pill { font-size: 0.6875rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.high { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
.pill.med { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.col .addt { width: 100%; margin-top: 8px; border: 0; background: none; color: var(--muted); padding: 8px; border-radius: calc(8px * var(--rs)); text-align: left; font-weight: 500; }
.col .addt:hover { background: var(--surface); color: var(--fg); }

/* ---------- gantt ---------- */
.gt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.gt { --lab: 230px; position: relative; }
.gt-row { display: grid; grid-template-columns: var(--lab) var(--w); height: 40px; border-top: 1px solid var(--line); }
.gt-row.head { height: 44px; border-top: 0; }
.gt-row.proj, .gt-row.group { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.gt-lab {
  position: sticky; left: 0; z-index: 3; background: inherit; background-color: var(--surface);
  padding: 0 10px; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 0.875rem;
}
.gt-row.proj .gt-lab, .gt-row.group .gt-lab { background-color: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.gt-lab .t { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-row.proj .t { font-weight: 700; }
.gt-row.task .gt-lab { padding-left: 34px; }
.gt-row.task.done .t { color: var(--muted); text-decoration: line-through; }
.gt-lab .tog { width: 22px; height: 22px; padding: 0; border: 0; background: none; color: var(--muted); border-radius: calc(4px * var(--rs)); flex: none; }
.gt-lab .tog:hover, .gt-lab .addsm:hover { background: var(--surface-2); color: var(--fg); }
.gt-lab .addsm { border: 0; background: none; color: var(--muted); font-size: 0.75rem; font-weight: 600; padding: 3px 6px; border-radius: calc(4px * var(--rs)); flex: none; }
.gt-lab .check { flex: none; margin: 0; }
.gt-track { position: relative; overflow: hidden;
  background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to right, transparent calc(var(--dw) * 5), color-mix(in srgb, var(--surface-2) 70%, transparent) calc(var(--dw) * 5));
  background-size: calc(var(--dw) * 7) 100%; }
.gt.zoom-month .gt-track { background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(var(--dw) * 28) 100%; }
.gt-scale { position: relative; height: 22px; overflow: hidden; }
.gt-scale span { position: absolute; top: 4px; white-space: nowrap; font-size: 0.75rem; padding-left: 5px; }
.gt-scale.m span { font-weight: 600; border-left: 1px solid var(--muted); top: 2px; height: 20px; }
.gt-scale.w span { font: 0.6875rem var(--f-mono); color: var(--muted); }
.gt-scale.w span.we { opacity: .55; }
.gbar {
  --c: var(--muted);
  position: absolute; top: 9px; height: 22px; border-radius: calc(5px * var(--rs)); z-index: 1;
  background: color-mix(in srgb, var(--c) 24%, var(--surface)); border: 1px solid var(--c);
  display: flex; align-items: center; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.gbar.dragging { cursor: grabbing; box-shadow: var(--shadow); z-index: 4; }
.gbar .prog { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--c) 62%, var(--surface)); }
.gbar .lbl { position: relative; padding: 0 8px; font: 500 0.6875rem var(--f-mono); white-space: nowrap; color: var(--fg); pointer-events: none; }
.gbar .h { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; z-index: 2; }
.gbar .h.l { left: 0; } .gbar .h.r { right: 0; }
.gbar .h::after { content: ""; position: absolute; top: 6px; bottom: 6px; left: 3px; width: 3px; border-radius: calc(2px * var(--rs)); background: var(--c); opacity: 0; }
.gbar:hover .h::after, .gbar:focus-visible .h::after { opacity: .9; }
.gbar.summary { top: 13px; height: 14px; border-radius: calc(3px * var(--rs)); background: var(--c); }
.gbar.summary .prog { background: color-mix(in srgb, var(--fg) 30%, var(--c)); }
.gbar.summary .lbl { display: none; }
.gbar.derived { border-style: dashed; background: color-mix(in srgb, var(--c) 18%, var(--surface)); cursor: pointer; }
.gms, .dia {
  --c: var(--muted);
  position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; padding: 0; z-index: 1;
  transform: rotate(45deg); border: 2px solid var(--c); background: var(--surface); border-radius: calc(2px * var(--rs));
}
.gms { cursor: grab; touch-action: pan-y; }
.gms.done, .dia.done { background: var(--c); }
.gms.late, .dia.late { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 25%, var(--surface)); }
.gt-links { position: absolute; top: 0; left: var(--lab); pointer-events: none; z-index: 2; }
.gt-links path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.gt-links path.bad { stroke: var(--danger); stroke-dasharray: 4 3; }
.gt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
.gt-today::before { content: "Today"; position: absolute; top: 26px; left: 5px; background: var(--surface); padding: 0 3px; font: 600 0.625rem var(--f-mono); color: var(--danger); text-transform: uppercase; letter-spacing: .06em; }
.gt.zoom-day .gt-today::before { display: none; }
.gt-scale.w span.td { color: var(--danger); font-weight: 700; opacity: 1; }
.navgrp { display: inline-flex; gap: 8px; }
@media (pointer: coarse) { .gbar .h { width: 16px; } .gbar .h::after { opacity: .6; left: 6px; } }
.gt-empty { padding: 28px 20px; display: grid; gap: 12px; justify-items: start; color: var(--muted); max-width: 60ch; }
.gt-select { padding: 7px 10px; border: 1px solid var(--line); border-radius: calc(8px * var(--rs)); background: var(--surface); max-width: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 0.8125rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 6px; }
.legend .dia { position: static; margin: 0 8px 0 3px; width: 11px; height: 11px; }
.legend .lb { width: 26px; height: 12px; border-radius: calc(3px * var(--rs)); border: 1px solid var(--muted); background: linear-gradient(to right, color-mix(in srgb, var(--muted) 62%, var(--surface)) 50%, color-mix(in srgb, var(--muted) 24%, var(--surface)) 50%); }
.legend svg { vertical-align: -3px; margin-right: 6px; }
.legend .tip { flex-basis: 100%; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 22, .45); display: grid; place-items: center; padding: 16px; }
.sheet {
  width: min(520px, 100%); max-height: calc(100% - 16px); overflow: auto;
  background: var(--surface); border-radius: calc(14px * var(--rs)); box-shadow: var(--shadow); padding: 20px;
}
.sheet h2 { font-size: 1.375rem; margin-bottom: 14px; }
form.f { display: grid; gap: 12px; }

/* ---------- rendering ---------- */
const main = $('#main');
function render() {
  $('#nav').innerHTML = VIEWS.map(([k, n]) =>
    `<button data-act="view" data-view="${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${ICONS[k]}${n}</button>`).join('');

    else if (ui.gtScroll === 'start') wrap.scrollLeft = 0;
    else wrap.scrollLeft = prevScroll;
  }

function renderSummary() {
  const t = todayStr();
  const today = itemsOn(t);
  const late = V.tasks().filter(isLate).length;
  const weekEnd = ymd(addDays(new Date(), 7));
  const week = V.tasks().filter(x => x.status !== 'done' && x.due && x.due >= t && x.due <= weekEnd).length;
  $('#summary').innerHTML = `<div class="eyebrow" style="padding-left:4px">${esc(fmt(new Date(), { weekday: 'long', day: 'numeric', month: 'long' }))}</div>

    <button class="stat ${late ? 'alert' : ''}" data-act="goto-agenda"><span>Overdue</span><b>${late}</b></button>`;

function chip(kind, o) {
  if (kind === 'event') {
    return `<button class="chip ev" data-act="edit-event" data-id="${o.id}" style="--c:${itemColor(o)}">${o.start ? `<b>${o.start}</b> ` : ''}${esc(o.title)}</button>`;
  }
  if (kind === 'task') {
    return `<button class="chip tk ${o.status === 'done' ? 'done' : ''}" data-act="edit-task" data-id="${o.id}" style="--c:${itemColor(o)}"><span class="box"></span>${esc(o.title)}</button>`;
  }
  return `<button class="chip dl" data-act="edit-project" data-id="${o.id}" style="--c:${o.color}">Due: ${esc(o.name)}</button>`;
}

function renderCalendar() {
  const m = parse(ui.month);
  const isMonth = ui.calMode === 'month';
  const sub = isMonth
    ? `Weeks ${isoWeek(m)}–${isoWeek(new Date(m.getFullYear(), m.getMonth() + 1, 0))}`
    : 'Everything coming up in the next 60 days';
  return `<header class="vh">
      <div><div class="eyebrow">${areaEyebrow('Calendar')}</div><h1>${isMonth ? esc(fmt(m, { month: 'long', year: 'numeric' })) : 'Agenda'}</h1><p class="sub">${sub}</p></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Calendar layout">
          <button data-act="cal-mode" data-mode="month" aria-pressed="${isMonth}">Month</button>

function renderMonth() {
  const m = parse(ui.month), mo = m.getMonth();
  const offset = (m.getDay() + 6) % 7, start = addDays(m, -offset);
  const dim = new Date(m.getFullYear(), mo + 1, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7);
  const t = todayStr();
  const ref = new Date(2024, 0, 1); // a Monday
  let h = '<div class="month" role="grid" aria-label="Month"><div class="wk-h" title="ISO week number">Wk</div>';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ref, i);
    h += `<div class="dow" role="columnheader">${esc(fmt(d, { weekday: window.innerWidth < 640 ? 'narrow' : 'short' }))}</div>`;
  }
  for (let w = 0; w < weeks; w++) {
    h += `<div class="wk">${isoWeek(addDays(start, w * 7))}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i), ds = ymd(d), { ev, tk, dl } = itemsOn(ds);
      const cls = ['day', d.getMonth() !== mo && 'out', ds === t && 'today', ds === ui.selected && 'sel', i >= 5 && 'wkend'].filter(Boolean).join(' ');
      const all = [...dl.map(p => chip('deadline', p)), ...ev.map(e => chip('event', e)), ...tk.map(x => chip('task', x))];
      const shown = all.slice(0, 3), more = all.length - shown.length;
      const dots = [...dl.map(p => p.color), ...ev.map(itemColor), ...tk.map(itemColor)].slice(0, 4);
      h += `<div class="${cls}" role="gridcell" tabindex="0" data-act="select-day" data-date="${ds}" aria-label="${esc(longDate(d))}, ${all.length} item${all.length === 1 ? '' : 's'}">
        <span class="num">${d.getDate()}</span>
        <div class="chips">${shown.join('')}${more ? `<span class="more">+${more} more</span>` : ''}</div>
        <div class="dots">${dots.map(c => `<i style="background:${c}"></i>`).join('')}</div>
      </div>`;
    }
  }
  return h + '</div>';
}

function itemRows(ds, { ev, tk, dl }) {
  const rows = [];
  dl.forEach(p => rows.push(`<li class="item"><span class="when">Deadline</span><div class="what">
    <button class="t" data-act="edit-project" data-id="${p.id}">${esc(p.name)} is due</button>
    <div class="meta"><span class="pdot" style="--c:${p.color}">Project</span>${atag(p)}</div></div></li>`));
  ev.forEach(e => {
    const multi = e.endDate && e.endDate !== e.date;
    const when = e.start ? `${e.start}${e.end ? `<br>${e.end}` : ''}` : 'All day';
    rows.push(`<li class="item ev" style="--c:${itemColor(e)}"><span class="when">${when}</span><div class="what">
      <button class="t" data-act="edit-event" data-id="${e.id}">${esc(e.title)}</button>
      <div class="meta">${atag(e)}${projLabel(e.projectId)}${multi ? `<span>${shortDate(e.date)} – ${shortDate(e.endDate)}</span>` : ''}${e.notes ? `<span>${esc(e.notes.slice(0, 80))}</span>` : ''}</div></div></li>`);
  });
  tk.forEach(x => rows.push(taskRow(x)));

}
function taskRow(x, showDue) {
  const done = x.status === 'done';
  return `<li class="item task ${done ? 'done' : ''}"><span class="when"><button class="check ${done ? 'on' : ''}" style="--c:${itemColor(x)}" data-act="toggle-task" data-id="${x.id}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(x.title)}"></button></span><div class="what">

    <div class="meta">${atag(x)}${projLabel(x.projectId)}<span>${STATUS.find(s => s[0] === x.status)[1]}</span>${showDue && x.due ? `<span class="${isLate(x) ? 'late' : ''}">Due ${relDays(x.due)}</span>` : ''}</div></div></li>`;

function renderDayPanel() {
  const ds = ui.selected, d = parse(ds), it = itemsOn(ds);
  const rows = itemRows(ds, it);
  const rel = relDays(ds);
  return `<aside class="panel" id="daypanel" aria-label="Selected day">

function renderAgenda() {
  const t = todayStr();
  const late = V.tasks().filter(isLate).sort((a, b) => a.due.localeCompare(b.due));
  let h = '<div class="agenda">';
  if (late.length) h += `<section class="overdue"><h3>Overdue <span class="mono">${late.length} task${late.length === 1 ? '' : 's'}</span></h3><ul class="items">${late.map(x => taskRow(x, true)).join('')}</ul></section>`;
  let any = false;
  for (let i = 0; i < 60; i++) {
    const d = addDays(parse(t), i), ds = ymd(d), it = itemsOn(ds);
    if (!it.ev.length && !it.tk.length && !it.dl.length) continue;

function projStats(p) {

  V.tasks().filter(t => sel === 'all' || (sel === 'none' ? !proj(t.projectId) : t.projectId === sel)).forEach(t => { const sp = taskSpan(t); if (sp) spans.push(sp); });

}

function shiftDates(kind, id, mode, n) {

    const t = db.tasks.find(o => o.id === id), sp = t && taskSpan(t); if (!sp) return false;
    if (mode === 'move') { if (t.start) t.start = sh(t.start); if (t.due) t.due = sh(t.due); }
    else if (mode === 'start') { const ns = sh(sp.s); t.start = ns > sp.e ? sp.e : ns; t.due = sp.e; }
    else { const ne = sh(sp.e); t.due = ne < sp.s ? sp.s : ne; t.start = sp.s; }
  } else {
    const p = proj(id); if (!p || !(p.start || p.due)) return false;
    const sp = projSpan(p);
    if (mode === 'move') {
      if (p.start) p.start = sh(p.start); if (p.due) p.due = sh(p.due);
      db.tasks.forEach(t => { if (t.projectId === id) { if (t.start) t.start = sh(t.start); if (t.due) t.due = sh(t.due); } });
    } else if (mode === 'start') { const ns = sh(sp.s); p.start = ns > sp.e ? sp.e : ns; p.due = sp.e; }
    else { const ne = sh(sp.e); p.due = ne < sp.s ? sp.s : ne; p.start = sp.s; }

const PC = { fg: [19, 36, 38], muted: [96, 112, 114], line: [221, 230, 230], soft: [241, 245, 245], wkend: [246, 249, 249], danger: [190, 58, 34], white: [255, 255, 255] };

        doc.setFont('helvetica', 'bold'); doc.setFontSize(fs + 0.5); doc.setTextColor(...PC.fg);
        const pctTxt = `${st.pct}%`;
        doc.text(pdfFit(doc, p.name + (ui.collapsed.has(p.id) ? ` (${st.total} tasks)` : ''), labW - 52), M + 17, cy, { baseline: 'middle' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(fs - 0.5); doc.setTextColor(...PC.muted);

        if (sp) {

            const pz = Math.min(c2, a + (z - a) * st.pct / 100);

        doc.setFillColor(...(done ? hexRgb(col) : PC.white)); doc.rect(M + indent, cy - 3.5, 7, 7, 'FD');

          doc.lines([[hh, hh], [-hh, hh], [-hh, -hh]], cx, cy - hh, [1, 1], 'FD', true);
          doc.setFontSize(6.5); doc.setTextColor(...PC.muted);

      item((x, y) => { doc.setDrawColor(...PC.muted); doc.setFillColor(...PC.white); doc.rect(x + 4, y - 3.5, 7, 7, 'FD'); }, 'Status (filled = done)');

        item((x, y) => { doc.setDrawColor(...PC.muted); doc.line(x, y, x + 13, y); doc.setFillColor(...PC.muted); doc.triangle(x + 16, y, x + 12, y - 2.3, x + 12, y + 2.3, 'F'); }, 'Starts after');

    doc.setFontSize(7); doc.setTextColor(...PC.muted); doc.setFont('helvetica', 'normal');
    doc.text('Tidemark Planner', M, footY);
    doc.text(`Page ${pi + 1} of ${pages}`, W - M, footY, { align: 'right' });
  }

  const slug = pdfText(o.title || 'gantt').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'gantt';
  doc.save(`${slug}-gantt-${todayStr()}.pdf`);
  return true;
}

function cfSet(cf, hsv, { redraw = false, fromHex = false } = {}) {
  const old = cf._hsv; cf._hsv = hsv;
  const hex = hsvToHex(hsv.h, hsv.s, hsv.v), mark = cf.querySelector('[data-cf-mark]'), a = hsv.h * Math.PI / 180;
  mark.style.left = `${88 + Math.cos(a) * hsv.s * 88}px`; mark.style.top = `${88 + Math.sin(a) * hsv.s * 88}px`; mark.style.background = hex;
  cf.querySelector('[data-cf-prev]').style.setProperty('--c', hex);
  cf.querySelector('[data-cf-v]').value = Math.round(hsv.v * 100);
  if (!fromHex) cf.querySelector('[data-cf-hex]').value = hex;
  const radio = cf.querySelector('[data-cf-custom]'), lab = radio.closest('label');
  radio.value = hex; radio.checked = true; radio.setAttribute('aria-label', `Custom color ${hex}`);
  cf.dispatchEvent(new CustomEvent('cf-change', { bubbles: true, detail: { name: radio.name, value: hex } }));
  lab.classList.add('has'); lab.style.setProperty('--c', hex);
  if (redraw || !old || old.v !== hsv.v) cfDraw(cf);
}
function cfOpen(cf) {
  const wheel = cf.querySelector('[data-cf-wheel]');
  if (!wheel.hidden && cf._hsv) return;
  wheel.hidden = false;
  const cur = cf.querySelector('.swatches input:checked')?.value;
  cfSet(cf, isHex(cur) ? hexToHsv(cur) : { h: 210, s: 0.65, v: 0.8 }, { redraw: true });
}
function cfPick(cf, ev) {
  const r = cf.querySelector('[data-cf-disc]').getBoundingClientRect();
  const dx = ev.clientX - r.left - r.width / 2, dy = ev.clientY - r.top - r.height / 2;
  cfSet(cf, { h: (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360, s: Math.min(1, Math.hypot(dx, dy) / (r.width / 2)), v: cf._hsv.v });
}

function defaultDate() { return ui.view === 'calendar' && ui.calMode === 'month' ? ui.selected : todayStr(); }
function newEvent(date) { openModal(eventForm({ title: '', date: date || defaultDate(), endDate: '', start: '', end: '', projectId: ui.view === 'projects' && proj(ui.projectId) ? ui.projectId : '', notes: '', area: defaultArea() })); }
function newTask(o = {}) {

  const inGantt = ui.view === 'timeline';

    start: inGantt ? todayStr() : '', due: o.due || (inGantt ? ymd(addDays(new Date(), 4)) : ''), notes: '' }));
}
function newProject() {
  const used = new Set(db.projects.map(p => p.color));
  openModal(projectForm({ name: '', color: COLORS.find(c => !used.has(c)) || COLORS[db.projects.length % COLORS.length], start: todayStr(), due: '', notes: '', area: defaultArea() }));

function onSubmit(form) {
  if (form.dataset.kind === 'notif') {
    const f = new FormData(form), btn = form.querySelector('[type=submit]');
    notifAction(btn, 'Saving…', async () => {
      const p = await readPush();
      p.settings = { ...p.settings, eventDefault: Number(f.get('eventDefault')), taskTime: f.get('taskTime'), digest: f.has('digest'), digestTime: f.get('digestTime'), areas: f.get('areas') || 'both', tz: Intl.DateTimeFormat().resolvedOptions().timeZone };
      await writePush(p); notif.settings = p.settings; persistNotif();
    }, 'Reminder settings saved');
    return;
  }
  if (form.dataset.kind === 'pdf') {
    const f = new FormData(form), o = { title: (f.get('title') || '').trim(), subtitle: (f.get('subtitle') || '').trim(), page: f.get('page'), range: f.get('range'),
      arrows: f.has('arrows'), today: f.has('today'), legend: f.has('legend'), dates: f.has('dates') };
    try { localStorage.setItem(PDFKEY, JSON.stringify({ page: o.page, arrows: o.arrows, today: o.today, legend: o.legend, dates: o.dates })); } catch (e) {}
    const btn = $('#p-go'); if (btn) { btn.disabled = true; btn.textContent = 'Creating PDF…'; }
    exportGanttPdf(o).then(ok => { if (ok) { closeModal(); toast('PDF downloaded'); } else if (btn) { btn.disabled = false; btn.textContent = 'Download PDF'; } })
      .catch(() => { toast('Something went wrong creating the PDF. Please try again.'); if (btn) { btn.disabled = false; btn.textContent = 'Download PDF'; } });
    return;
  }
  const raw = new FormData(form), fd = Object.fromEntries(raw);
  const kind = form.dataset.kind, id = form.dataset.id;
  for (const k in fd) if (typeof fd[k] === 'string') fd[k] = fd[k].trim();
  let list, item;
  if (kind === 'event') {
    if (fd.endDate && fd.endDate <= fd.date) fd.endDate = '';
    if (fd.end && (!fd.start || fd.end <= fd.start)) fd.end = '';
    fd.area = proj(fd.projectId)?.area || (fd.area === 'personal' ? 'personal' : 'work');
    list = db.events; item = { color: isHex(fd.color) ? fd.color.toLowerCase() : '', area: fd.area, title: fd.title, date: fd.date, endDate: fd.endDate, start: fd.start, end: fd.end, projectId: fd.projectId, notes: fd.notes, remind: fd.remind === '' || fd.remind === undefined ? null : Number(fd.remind) };
  } else if (kind === 'task') {
    const deps = fd.projectId ? raw.getAll('deps').filter(d => db.tasks.some(t => t.id === d && t.projectId === fd.projectId)) : [];
    if (!fd.start && deps.length) {
      const ends = deps.map(d => taskSpan(db.tasks.find(t => t.id === d))?.e).filter(Boolean).sort();
      if (ends.length) fd.start = ymd(addDays(parse(ends.pop()), 1));
      if (fd.start && fd.due && fd.due < fd.start) fd.due = '';
    }
    if (fd.start && fd.due && fd.due < fd.start) { const t = fd.start; fd.start = fd.due; fd.due = t; }
    fd.area = proj(fd.projectId)?.area || (fd.area === 'personal' ? 'personal' : 'work');
    list = db.tasks; item = { color: isHex(fd.color) ? fd.color.toLowerCase() : '', area: fd.area, title: fd.title, projectId: fd.projectId, start: fd.start, due: fd.due, deps, status: fd.status, priority: fd.priority, notes: fd.notes };
  } else {
    if (fd.start && fd.due && fd.due < fd.start) { const s = fd.start; fd.start = fd.due; fd.due = s; }
    fd.area = fd.area === 'personal' ? 'personal' : 'work';
    list = db.projects; item = { name: fd.name, color: isHex(fd.color) ? fd.color.toLowerCase() : COLORS[0], start: fd.start, due: fd.due, notes: fd.notes, area: fd.area };
    if (id) [...db.tasks, ...db.events].forEach(o => { if (o.projectId === id) o.area = fd.area; });
  }
  if (id) Object.assign(list.find(o => o.id === id), item);
  else { item.id = uid(); list.push(item); if (kind === 'project' && ui.view === 'projects') ui.projectId = item.id; }
  if (kind === 'event' && ui.view === 'calendar') { ui.selected = item.date; ui.month = ui.month.slice(0, 8) === item.date.slice(0, 8) ? ui.month : item.date.slice(0, 8) + '01'; }
  ui.lastArea = fd.area;
  const saved = id ? list.find(o => o.id === id) : item;
  save(); closeModal(); render();
  toast(!shown(saved) ? `Saved to ${areaName(areaOf(saved))}. Switch to ${areaName(areaOf(saved))} or All to see it.` : id ? 'Saved' : `${kind[0].toUpperCase() + kind.slice(1)} added`);
}

function armOrRun(btn, label, fn) {
  if (btn.classList.contains('armed')) { fn(); return; }
  btn.classList.add('armed'); btn.dataset.label = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = btn.dataset.label; } }, 4000);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (ev.target === modal) { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'area': ui.area = el.dataset.area; saveUI(); render(); break;
    case 'theme-open': openThemePanel(); break;
    case 'theme-close': closeThemePanel(); break;
    case 'theme-reset': armOrRun(el, 'Tap again to reset', () => { theme = { ...TT.D }; TT.save(theme); rerenderThemePanel(); toast('Theme reset to default'); }); break;
    case 'view': ui.view = el.dataset.view; ui.gtScroll = 'today'; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'cal-mode': ui.calMode = el.dataset.mode; saveUI(); render(); break;
    case 'prev': case 'next': {
      const m = parse(ui.month); ui.month = ymd(new Date(m.getFullYear(), m.getMonth() + (act === 'next' ? 1 : -1), 1)); render(); break;
    }
    case 'today': case 'goto-today': {
      const n = new Date(); ui.view = 'calendar'; ui.calMode = 'month'; ui.selected = todayStr(); ui.month = ymd(new Date(n.getFullYear(), n.getMonth(), 1)); saveUI(); render(); break;
    }
    case 'goto-agenda': ui.view = 'calendar'; ui.calMode = 'agenda'; saveUI(); render(); break;
    case 'select-day': {
      ui.selected = el.dataset.date;
      const d = parse(ui.selected), m = parse(ui.month);
      if (d.getMonth() !== m.getMonth()) ui.month = ymd(new Date(d.getFullYear(), d.getMonth(), 1));
      render();
      if (window.innerWidth <= 1100) $('#daypanel')?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      break;
    }
    case 'quick-add': openModal(`<h2>Add to your planner</h2><div class="choice">
        <button data-act="new-event"><b>Event</b><span>A meeting, appointment or trip on the calendar</span></button>
        <button data-act="new-task"><b>Task</b><span>Something to get done, with a due date and status</span></button>
        <button data-act="new-project"><b>Project</b><span>A goal with a deadline that groups tasks</span></button></div>
        <div class="actions"><span class="grow"></span><button class="btn" data-act="close">Cancel</button></div>`); break;
    case 'new-event': newEvent(el.dataset.date); break;
    case 'new-task': newTask({ due: el.dataset.date, status: el.dataset.status, projectId: el.dataset.project }); break;
    case 'new-project': newProject(); break;
    case 'edit-event': { const o = db.events.find(x => x.id === id); if (o) openModal(eventForm(o)); break; }
    case 'edit-task': { const o = db.tasks.find(x => x.id === id); if (o) openModal(taskForm(o)); break; }
    case 'edit-project': { const o = proj(id); if (o) openModal(projectForm(o)); break; }
    case 'toggle-task': { const o = db.tasks.find(x => x.id === id); if (o) { o.status = o.status === 'done' ? 'todo' : 'done'; save(); render(); } break; }
    case 'move-task': { const o = db.tasks.find(x => x.id === id); if (o) { o.status = el.dataset.to; save(); render(); } break; }
    case 'pick-project': ui.projectId = id; saveUI(); render(); break;
    case 'open-board': ui.view = 'projects'; ui.projectId = id; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'tl-prev': case 'tl-next': {
      const step = { day: 14, week: 28, month: 91 }[ui.zoom] || 28;
      ui.tlStart = ymd(addDays(parse(ui.tlStart), act === 'tl-next' ? step : -step)); ui.gtScroll = 'start'; render(); break;
    }
    case 'tl-today': ui.gtScroll = 'today'; ui.tlStart = ymd(addDays(mondayOf(new Date()), ui.zoom === 'month' ? -28 : -7)); render(); break;
    case 'gt-zoom': ui.zoom = el.dataset.zoom; ui.gtScroll = 'today'; saveUI(); render(); break;
    case 'gt-pdf': pdfDialog(); break;
    case 'gt-fit': fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); break;
    case 'gt-toggle': if (ui.collapsed.has(id)) ui.collapsed.delete(id); else ui.collapsed.add(id); render(); break;
    case 'open-gantt': ui.view = 'timeline'; ui.ganttProject = id; fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'close': closeModal(); break;
    case 'delete': armOrRun(el, 'Click again to delete', () => {
      const kind = el.dataset.kind;
      if (kind === 'event') db.events = db.events.filter(x => x.id !== id);
      if (kind === 'task') { db.tasks = db.tasks.filter(x => x.id !== id); db.tasks.forEach(x => { x.deps = x.deps.filter(d => d !== id); }); }
      if (kind === 'project') {
        db.projects = db.projects.filter(x => x.id !== id);
        db.tasks.forEach(x => { if (x.projectId === id) x.projectId = ''; });
        db.events.forEach(x => { if (x.projectId === id) x.projectId = ''; });
        if (ui.projectId === id) ui.projectId = 'all';
      }
      save(); closeModal(); render(); toast('Deleted');
    }); break;
    case 'keep-sample': db.sample = false; save(); render(); break;
    case 'clear-all': db = normalize({}); save(); ui.projectId = 'all'; render(); toast('Examples cleared'); break;
    case 'data': dataSheet(); break;
    case 'sync-connect': {
      const t = ($('#s-token')?.value || '').trim();
      if (!/^(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})$/.test(t)) { toast('That does not look like a GitHub token. It starts with ghp_ or github_pat_.'); break; }
      sync = { token: t, gistId: '', last: 0, fresh: true }; persistSync();
      el.disabled = true; el.textContent = 'Connecting…';
      syncNow().then(() => {
        if (syncState.status === 'ok') { toast('Sync is on'); dataSheet(); }
        else {
          const auth = /token|refused/.test(syncState.msg);
          sync = {}; persistSync(); setSyncStatus('off'); dataSheet();
          toast(auth ? 'GitHub did not accept that token. Check you copied all of it and ticked the gist box.' : 'Could not reach GitHub. Check your connection and try again.');
        }
      });
      break;
    }
    case 'sync-now': syncNow(); break;
    case 'notif-on': notifAction(el, 'Turning on…', enableNotifications, 'Notifications are on. A test reminder from the service will follow within about 10 minutes.'); break;
    case 'notif-off': armOrRun(el, 'Tap again to turn off', () => notifAction(el, 'Turning off…', disableNotifications, 'Notifications are off on this device')); break;
    case 'notif-test': notifAction(el, 'Requesting…', async () => {
      const p = await readPush(); p.testRequested = Date.now(); await writePush(p);
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification('Test from this device', { body: 'This device can show notifications. A test from the reminder service will follow within about 10 minutes.', icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', tag: 'tidemark-test' });
    }); break;
    case 'sync-off': armOrRun(el, 'Tap again to turn off', () => { sync = {}; persistSync(); setSyncStatus('off'); dataSheet(); toast('Sync is off on this device. Your planner stays here.'); }); break;
    case 'copy-export': {
      const ta = $('#d-export');
      const fallback = () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C or Cmd+C to copy'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => toast('Backup copied'), fallback); else fallback();
      break;
    }
    case 'download-export': {
      const blob = new Blob([$('#d-export').value], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tidemark-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'do-import': {
      const fileIn = $('#d-file'), text = $('#d-import').value.trim();
      const apply = raw => {
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.events)) throw new Error('shape');
          db = normalize({ ...parsed, sample: false }); save(); ui.projectId = 'all'; closeModal(); render(); toast('Backup restored');
        } catch (e) { toast('That is not a Tidemark backup. Check you copied all of it.'); }
      };
      if (text) apply(text);
      else if (fileIn.files[0]) fileIn.files[0].text().then(apply);
      else toast('Paste a backup or choose a file first');
      break;
    }
    case 'load-sample': db = normalize(sample()); save(); ui.projectId = 'all'; closeModal(); render(); toast('Examples loaded'); break;
    case 'wipe': armOrRun(el, 'Click again to erase', () => { db = normalize({}); save(); ui.projectId = 'all'; closeModal(); render(); toast('Planner erased'); }); break;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'gt-project') { ui.ganttProject = ev.target.value; fitGantt(); ui.gtScroll = 'start'; saveUI(); render(); return; }
  const aform = ev.target.closest('form.f[data-kind="task"], form.f[data-kind="event"]');
  if (aform && ev.target.id === 'f-project') {
    const cur = aform.querySelector('input[name=area]:checked')?.value;
    $('#f-areabox').outerHTML = areaField({ projectId: ev.target.value, area: cur }, aform.dataset.kind);
  }
  const form = ev.target.closest('form.f[data-kind="task"]');
  if (form && ev.target.id === 'f-project') {
    const keep = [...form.querySelectorAll('input[name=deps]:checked')].map(i => i.value);
    $('#f-deps').innerHTML = depsField(form.dataset.id, keep, ev.target.value);
  }
});
document.addEventListener('click', ev => {
  const lab = ev.target.closest('.sw-custom'); if (!lab) return;
  const cf = lab.closest('[data-cf]'); cfOpen(cf);
  if (!lab.querySelector('input').value) ev.preventDefault();
});
document.addEventListener('change', ev => {
  if (ev.target.matches('[data-cf-custom]')) cfOpen(ev.target.closest('[data-cf]'));
  if (ev.target.closest('[data-cf]') && ev.target.type === 'radio' && !ev.target.hasAttribute('data-cf-custom')) { const w = ev.target.closest('[data-cf]')?.querySelector('[data-cf-wheel]'); if (w) w.hidden = true; }
});
document.addEventListener('input', ev => {
  const cf = ev.target.closest('[data-cf]'); if (!cf || !cf._hsv) return;
  if (ev.target.matches('[data-cf-v]')) cfSet(cf, { ...cf._hsv, v: ev.target.value / 100 });
  if (ev.target.matches('[data-cf-hex]')) { let v = ev.target.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (isHex(v)) cfSet(cf, hexToHsv(v.toLowerCase()), { fromHex: true }); }
});
let cfDrag = null;
document.addEventListener('pointerdown', ev => {
  const disc = ev.target.closest('[data-cf-disc]'); if (!disc) return;
  ev.preventDefault(); cfDrag = disc.closest('[data-cf]'); try { disc.setPointerCapture(ev.pointerId); } catch (e) {} cfPick(cfDrag, ev);
});
document.addEventListener('pointermove', ev => { if (cfDrag) cfPick(cfDrag, ev); });
document.addEventListener('pointerup', () => { cfDrag = null; });
document.addEventListener('pointercancel', () => { cfDrag = null; });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-th]');
  if (b) { const k = b.dataset.th; theme[k] = b.dataset.v; setTheme(k === 'bg' ? { preset: matchPreset() } : {}); return; }
  const pr = ev.target.closest('[data-th-preset]');
  if (pr) { const p = TT.PRESETS.find(x => x.id === pr.dataset.thPreset); setTheme({ preset: p.id, accent: p.accent, bg: p.bg }); }
});
const thColor = (name, value) => {
  if (!isHex(value)) return;
  if (name === 'th-accent') { theme.accent = value; setTheme({ preset: matchPreset() }, false); }
  if (name === 'th-work') setTheme({ work: value }, false);
  if (name === 'th-personal') setTheme({ personal: value }, false);
};
document.addEventListener('change', ev => { if (/^th-/.test(ev.target.name || '')) thColor(ev.target.name, ev.target.value); });
document.addEventListener('cf-change', ev => { if (/^th-/.test(ev.detail.name)) thColor(ev.detail.name, ev.detail.value); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { TT.apply(theme); rerenderThemePanel(); });
document.addEventListener('submit', ev => { const f = ev.target.closest('form.f'); if (!f) return; ev.preventDefault(); onSubmit(f); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !modal.hidden) { closeModal(); return; }
  if (ev.key === 'Escape' && !themePanel().hidden) { closeThemePanel(); return; }
  const bar = ev.target.closest?.('.gt [data-kind][data-id]');
  if (bar && ev.target === bar) {
    const { kind, id } = bar.dataset;
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEditor(kind, id); return; }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      ev.preventDefault();
      const mode = ev.shiftKey && !bar.classList.contains('gms') ? 'end' : 'move';
      if (shiftDates(kind, id, mode, ev.key === 'ArrowRight' ? 1 : -1)) { save(); render(); refocusBar(kind, id); toast(rangeText(kind, id)); }
      return;
    }
  }
  const day = ev.target.closest?.('.day');
  if (day && ev.target === day && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); day.click(); }
});

/* drag and drop on the board */
main.addEventListener('dragstart', ev => {
  const c = ev.target.closest('.card[data-id]'); if (!c) return;
  ev.dataTransfer.setData('text/plain', c.dataset.id); ev.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
main.addEventListener('dragend', ev => { ev.target.closest?.('.card')?.classList.remove('dragging'); main.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
main.addEventListener('dragover', ev => { const col = ev.target.closest('.col[data-status]'); if (!col) return; ev.preventDefault(); col.classList.add('over'); });
main.addEventListener('dragleave', ev => { const col = ev.target.closest('.col'); if (col && !col.contains(ev.relatedTarget)) col.classList.remove('over'); });
main.addEventListener('drop', ev => {
  const col = ev.target.closest('.col[data-status]'); if (!col) return;
  ev.preventDefault();
  const o = db.tasks.find(x => x.id === ev.dataTransfer.getData('text/plain'));
  if (o && o.status !== col.dataset.status) { o.status = col.dataset.status; save(); }
  render();
});

/* gantt: drag bars to reschedule */
function openEditor(kind, id) {
  if (kind === 'task') { const o = db.tasks.find(x => x.id === id); if (o) openModal(taskForm(o)); }
  else { const o = proj(id); if (o) openModal(projectForm(o)); }
}
let drag = null;
main.addEventListener('pointerdown', ev => {
  const bar = ev.target.closest('.gt [data-kind][data-id]');
  if (!bar || ev.button > 0) return;
  const h = ev.target.closest('.h');
  const dw = parseFloat(getComputedStyle(bar.closest('.gt')).getPropertyValue('--dw')) || 16;
  drag = { bar, kind: bar.dataset.kind, id: bar.dataset.id, mode: h ? (h.classList.contains('l') ? 'start' : 'end') : 'move',
    x0: ev.clientX, left: parseFloat(bar.style.left), width: bar.offsetWidth, dw, moved: false, n: 0, pid: ev.pointerId };
  try { bar.setPointerCapture(ev.pointerId); } catch (e) {}
});
main.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.pid) return;
  const dx = ev.clientX - drag.x0;
  if (!drag.moved && Math.abs(dx) < 5) return;
  if (!drag.moved) { drag.moved = true; drag.bar.classList.add('dragging'); }
  const n = Math.round(dx / drag.dw); drag.n = n;
  const { bar, left, width, dw } = drag;
  if (drag.mode === 'move') bar.style.left = `${left + n * dw}px`;
  else if (drag.mode === 'start') { const k = Math.min(n, Math.round(width / dw) - 1); bar.style.left = `${left + k * dw}px`; bar.style.width = `${width - k * dw}px`; }
  else bar.style.width = `${Math.max(dw, width + n * dw)}px`;
});
function endDrag(ev, cancelled) {
  if (!drag || ev.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (!d.moved) { if (!cancelled) openEditor(d.kind, d.id); return; }
  if (!cancelled && shiftDates(d.kind, d.id, d.mode, d.n)) { save(); toast(rangeText(d.kind, d.id)); }
  render();
}
main.addEventListener('pointerup', ev => endDrag(ev, false));
main.addEventListener('pointercancel', ev => endDrag(ev, true));

/* keep in sync with other tabs, re-render on resize breakpoints and at midnight */
window.addEventListener('storage', ev => {
  if (ev.key === KEY) { db = load(); snapshot(); render(); }
  if (ev.key === SYNCKEY) { try { sync = JSON.parse(ev.newValue) || {}; } catch (e) { sync = {}; } setSyncStatus(sync.token ? 'ok' : 'off'); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
setInterval(updateSyncUI, 20000);
let lastNarrow = window.innerWidth < 640;
window.addEventListener('resize', () => { const n = window.innerWidth < 640; if (n !== lastNarrow) { lastNarrow = n; if (modal.hidden) render(); } });
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 60000);

ui.gtScroll = 'today';
render();
updateSyncUI();
syncNow().then(checkSubscription);

/* offline support + install when served as a standalone site */
if ('serviceWorker' in navigator && window.self === window.top && /^https:|^http:\/\/localhost/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
